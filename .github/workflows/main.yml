name: Build Android TV Launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android TV APK (Android 9–14)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ""

      - name: Install Android SDK packages
        run: |
          set +e
          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          if [ "${sdkmanager_status}" -ne 0 ]; then
            echo "::error::Could not install the required Android SDK packages"
            exit "${sdkmanager_status}"
          fi

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the bundled TV interface
        run: pnpm build:tv-html

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-launcher-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
